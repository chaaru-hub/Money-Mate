<style>
/* Layout: phone-first app column. Hero balance, quick actions, then tabbed sections (Home, People, Banks, Spending) with bottom sheets for every form. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface2:#eceff8; --fg:#0f1530; --muted:#657091; --line:#e3e7f2;
  --brand:#3a4cf0; --brand-fg:#ffffff; --brand-soft:#dde1fd;
  --hero:#10183a; --hero-fg:#ffffff; --hero-mut:#aab4dc;
  --get:#0b8f63; --get-bg:#ddf4ea; --give:#d93a40; --give-bg:#fde7e8;
  --shadow:0 10px 30px rgba(16,24,58,.08); --scrim:rgba(10,15,34,.5);
  --av-s:70%; --av-bg:88%; --av-fg:28%;
  --f-disp:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f22; --surface:#131a35; --surface2:#1b2447; --fg:#eef1ff; --muted:#8f9bc4; --line:#232d55;
  --brand:#7b8cff; --brand-fg:#0a0f22; --brand-soft:#28336f;
  --hero:#1f2b73; --hero-fg:#ffffff; --hero-mut:#b4bde6;
  --get:#3ddc9a; --get-bg:#11382c; --give:#ff7a80; --give-bg:#3d1a20;
  --shadow:0 10px 30px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  --av-s:40%; --av-bg:24%; --av-fg:82%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f22; --surface:#131a35; --surface2:#1b2447; --fg:#eef1ff; --muted:#8f9bc4; --line:#232d55;
  --brand:#7b8cff; --brand-fg:#0a0f22; --brand-soft:#28336f;
  --hero:#1f2b73; --hero-fg:#ffffff; --hero-mut:#b4bde6;
  --get:#3ddc9a; --get-bg:#11382c; --give:#ff7a80; --give-bg:#3d1a20;
  --shadow:0 10px 30px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  --av-s:40%; --av-bg:24%; --av-fg:82%; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;padding-block:18px 170px;display:flex;flex-direction:column;gap:22px}
#view{display:flex;flex-direction:column;gap:22px;min-width:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:1.15rem;flex-shrink:0}
.brand h1{font-family:var(--f-disp);font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.brand p{font-size:.78rem;color:var(--muted)}

/* hero */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:26px;padding:22px 20px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;border:30px solid rgba(255,255,255,.07);pointer-events:none}
.hero .lbl{font-size:.78rem;color:var(--hero-mut);font-weight:600;letter-spacing:.04em}
.hero .big{font-family:var(--f-disp);font-size:2.3rem;font-weight:700;letter-spacing:-.02em;margin:4px 0 16px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;min-width:0}
.pill .dot{width:8px;height:8px;border-radius:50%;grid-row:1/3}
.dot.g{background:#46e0a3}.dot.r{background:#ff8a8f}
.pill small{font-size:.72rem;color:var(--hero-mut)}
.pill b{font-family:var(--f-disp);font-weight:600;font-size:1.02rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.hero .foot{margin-top:14px;font-size:.8rem;color:var(--hero-mut)}
.hero .foot b{color:var(--hero-fg)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa-b{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.78rem;font-weight:600;padding:4px 0}
.qi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--brand)}
.qi.get{color:var(--get)}.qi.give{color:var(--give)}

/* sections / rows */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec h2{font-family:var(--f-disp);font-size:1.02rem;font-weight:600}
.sec a,.link{font-size:.82rem;font-weight:600;color:var(--brand);background:none;border:0;padding:0}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.group{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;background:none;border:0;text-align:left;min-height:64px}
.row+.row{border-top:1px solid var(--line)}
button.row:active{background:var(--surface2)}
.r-main{display:flex;flex-direction:column;min-width:0;flex:1}
.r-main b{font-weight:600;overflow-wrap:anywhere}
.r-main small{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.r-amt{font-family:var(--f-disp);font-weight:600;font-size:.95rem;flex-shrink:0;font-variant-numeric:tabular-nums;text-align:right}
.pos{color:var(--get)}.neg{color:var(--give)}.mut{color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;
  background:hsl(var(--h) var(--av-s) var(--av-bg));color:hsl(var(--h) 55% var(--av-fg))}
.av.lg{width:56px;height:56px;font-size:1.1rem}
.ci{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}
.iconbtn{background:none;border:0;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.iconbtn:hover{background:var(--surface2)}
.emptyb{background:var(--surface);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:center}
.emptyb h3{font-family:var(--f-disp);font-size:1.05rem}
.emptyb p{color:var(--muted);font-size:.9rem;max-width:32ch}
.smallnote{padding:18px 16px;color:var(--muted);font-size:.88rem;text-align:center}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--brand-soft);color:var(--fg);border-radius:16px;padding:12px 14px;font-size:.85rem}

/* people */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);color:var(--muted)}
.search input{border:0;background:none;padding:14px 0;width:100%;min-width:0;outline:none;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.84rem;min-height:38px}
.chip.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}

/* bank cards */
.bk{width:100%;text-align:left;border:0;border-radius:24px;padding:20px;color:#fff;background:var(--bc);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.bk::after{content:"";position:absolute;right:-40px;bottom:-70px;width:190px;height:190px;border-radius:50%;border:28px solid rgba(255,255,255,.12);pointer-events:none}
.bk-name{font-size:.85rem;font-weight:600;opacity:.9}
.bk-bal{font-family:var(--f-disp);font-size:1.7rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.bk-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;position:relative;z-index:1}
.tag{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:600}
.total-line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;color:var(--muted);font-size:.88rem}
.total-line b{font-family:var(--f-disp);color:var(--fg);font-size:1.1rem;font-variant-numeric:tabular-nums}

/* spending */
.m-tot{font-family:var(--f-disp);font-size:2.1rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.m-sub{color:var(--muted);font-size:.85rem}
.panel{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-family:var(--f-disp);font-size:.92rem;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.bar b{font-size:.66rem;color:var(--muted);font-weight:600;height:1em;line-height:1}
.bar .col{height:84px;width:100%;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;border-radius:9px 9px 5px 5px;background:var(--brand-soft);min-height:4px}
.bar.today i{background:var(--brand)}
.bar span{font-size:.72rem;color:var(--muted)}
.bar.today span{color:var(--fg);font-weight:700}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface2);gap:2px}
.stack i{display:block;min-width:4px}
.legend{display:flex;flex-direction:column;gap:8px}
.lg{display:flex;align-items:center;gap:10px;font-size:.88rem}
.lg .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.lg span:nth-child(2){flex:1}
.lg b{font-variant-numeric:tabular-nums;font-weight:600}
.lg em{font-style:normal;color:var(--muted);width:3.2em;text-align:right;font-size:.8rem}
.dayh{display:flex;justify-content:space-between;padding:10px 16px 6px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2)}

.exp{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.8rem;flex-shrink:0}
.strip{display:flex;align-items:center;gap:12px;padding:14px 16px}
.sw-row{display:flex;flex-wrap:wrap;gap:12px}
.swatch{width:38px;height:38px;border-radius:50%;border:0;background:var(--c);box-shadow:0 0 0 3px var(--bg),0 0 0 3px var(--bg);flex-shrink:0}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
/* ---- motion + polish ---- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55);opacity:0}65%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,12px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
#view.enter>*{animation:rise .62s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:0.06s}#view.enter>*:nth-child(3){animation-delay:0.12s}#view.enter>*:nth-child(4){animation-delay:0.18s}#view.enter>*:nth-child(5){animation-delay:0.24s}#view.enter>*:nth-child(6){animation-delay:0.30s}#view.enter>*:nth-child(7){animation-delay:0.36s}#view.enter>*:nth-child(8){animation-delay:0.42s}
.bar i{transform-origin:bottom}.stack i,.prog2 i{transform-origin:left}
#view.enter .bar i{animation:growY .85s cubic-bezier(.2,.8,.2,1) both}
#view.enter .bar:nth-child(1) i{animation-delay:0.25s}#view.enter .bar:nth-child(2) i{animation-delay:0.31s}#view.enter .bar:nth-child(3) i{animation-delay:0.37s}#view.enter .bar:nth-child(4) i{animation-delay:0.43s}#view.enter .bar:nth-child(5) i{animation-delay:0.49s}#view.enter .bar:nth-child(6) i{animation-delay:0.55s}#view.enter .bar:nth-child(7) i{animation-delay:0.61s}

  var m={};
  entries.forEach(function(e){var p=m[e.person]||(m[e.person]={name:e.person,net:0,items:[]});p.net+=sgn(e)*outOf(e);p.items.push(e)});
  return Object.keys(m).map(function(k){var p=m[k];p.net=r2(p.net);return p}).sort(function(a,b){return Math.abs(b.net)-Math.abs(a.net)});
}
function movements(bid){
  var m=[];
  entries.forEach(function(e){(e.repays||[]).forEach(function(r){if(r.bank===bid)m.push({date:r.date,title:e.person,amt:sgn(e)*r.amount})})});
  expenses.forEach(function(x){if(x.bank===bid)m.push({date:x.date,title:x.note||catOf(x),amt:-x.amount})});
  bankLog.forEach(function(l){if(l.bank===bid)m.push({date:l.date,title:l.person,amt:l.amt})});
  investments.forEach(function(v){if(v.bank===bid)m.push({date:v.date,title:v.name||v.type,amt:-v.amount})});
  return m.sort(function(a,b){return b.date.localeCompare(a.date)});
}
function balance(b){return r2(b.opening+movements(b.id).reduce(function(s,m){return s+m.amt},0))}
function pendingFor(bid){
  var g=0,o=0;
  entries.forEach(function(e){if(e.bank===bid){var x=outOf(e);if(e.type==='get')g+=x;else o+=x}});
  return {get:r2(g),give:r2(o)};
}
function totals(){
  var get=0,give=0,bank=0;
  people().forEach(function(p){if(p.net>0)get+=p.net;else if(p.net<0)give-=p.net});
  banks.forEach(function(b){bank+=balance(b)});
  return {get:r2(get),give:r2(give),bank:r2(bank),proj:r2(bank+get-give)};
}
function allSpend(){return expenses.concat(investments.map(function(v){return {id:v.id,amount:v.amount,note:v.name||v.type,cat:'Investment',bank:v.bank,date:v.date,inv:true}}))}
function monthSpent(off){
  var n=new Date(),s=new Date(n.getFullYear(),n.getMonth()+off,1),e=new Date(n.getFullYear(),n.getMonth()+off+1,1);
  return allSpend().filter(function(x){var d=new Date(x.date);return d>=s&&d<e});
}
var sum=function(a){return r2(a.reduce(function(s,x){return s+x.amount},0))};
var defBank=function(){return bankById(lastBank)?lastBank:(banks[0]?banks[0].id:'')};

/* fully repaid people leave the list; their bank movements are kept */
function sweep(){
  var by={},gone=[];
  entries.forEach(function(e){(by[e.person]=by[e.person]||[]).push(e)});
  Object.keys(by).forEach(function(n){
    var list=by[n];
    if(list.every(function(e){return outOf(e)<=0})){
      list.forEach(function(e){(e.repays||[]).forEach(function(r){bankLog.push({id:r.id||uid(),bank:r.bank,amt:sgn(e)*r.amount,person:n,date:r.date})})});
      entries=entries.filter(function(e){return e.person!==n});
      gone.push(n);
    }
  });
  return gone;
}
function act(fn,msg){
  var s=snapshot();
  fn();
  processSips();
  var gone=sweep();
  if(gone.length)confetti();
  if(gone.length)msg=gone.join(', ')+(gone.length>1?' are':' is')+' fully settled and removed from People';
  save();render();refreshSheet();toast(msg,s);
}

}

var showAllInv=false;
var pad2=function(n){return String(n).padStart(2,'0')};
function sipDue(s,y,m){var dim=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(s.day,dim),12)}
function nextDue(s){
  var st=new Date(s.start),y=st.getFullYear(),m=st.getMonth();
  if(s.last){var p=s.last.split('-'),d0=new Date(+p[0],+p[1],1);y=d0.getFullYear();m=d0.getMonth();}
  return sipDue(s,y,m);
}
function processSips(){
  var n=0,now=new Date(),end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);
  sips.forEach(function(s){
    for(var g=0;g<600;g++){
      var d=nextDue(s);if(d>end)break;
      investments.unshift({id:'i'+uid(),name:s.name,type:s.type,amount:s.amount,sip:true,sipId:s.id,bank:s.bank,date:d.toISOString()});
      s.last=d.getFullYear()+'-'+pad2(d.getMonth()+1);n++;
    }
  });
  return n;
}

      types.map(function(k){return '<div class="lg"><span class="sw" style="background:'+(ITYPES[k]||ITYPES.Other)+'"></span><span>'+esc(k)+'</span><b>'+fmt(byT[k])+'</b><em>'+Math.round(byT[k]/tot*100)+'%</em></div>'}).join('')+'</div></div>'+
    '<div class="group">'+sec('Your funds')+'<div class="card">'+holds.map(function(h){

  var items=p.items.slice().sort(function(a,b){return b.date.localeCompare(a.date)});

    var out=outOf(e),paid=out<=0,g=e.type==='get';
    return '<div class="ent'+(paid?' paid':'')+'"><span class="r-main"><b>'+esc(e.note||(g?'To receive':'To give'))+'</b><small>'+dt(e.date)+(e.bank?' · '+esc(bankName(e.bank)):'')+' · '+

      '<button type="button" class="iconbtn" data-act="delentry" data-id="'+e.id+'" aria-label="Delete entry">'+ic('trash',18)+'</button></div>';

/* ---------- actions ---------- */
function payPerson(name,amt,bid){
  var mine=entries.filter(function(e){return e.person===name});
  var net=r2(mine.reduce(function(s,e){return s+sgn(e)*outOf(e)},0));if(!net)return;
  var dir=net>0?'get':'give',left=Math.min(amt,Math.abs(net));
  if(bid)lastBank=bid;
  mine.filter(function(e){return e.type===dir&&outOf(e)>0}).sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(e){
    if(left<=0)return;var a=Math.min(left,outOf(e));
    e.repays.push({id:uid(),amount:a,date:new Date().toISOString(),bank:bid});left=r2(left-a);
  });
}
function submitForm(form){
  var f=form.dataset.form,err=function(m){$('fErr').textContent=m},amt=r2(parseFloat(($('fAmt')||{}).value));
  if(f==='entry'){
    var name=$('fPerson').value.trim();
    if(!(amt>0))return err('Enter an amount greater than 0.');
    if(!name)return err('Enter who this is with.');
    var ex=entries.find(function(e){return e.person.toLowerCase()===name.toLowerCase()});if(ex)name=ex.person;
    var type=st.type,bank=st.bank,note=$('fNote').value.trim();
    closeSheet();
    act(function(){endSample();var bid=bankById(bank)?bank:'';if(bid)lastBank=bid;
      entries.unshift({id:'e'+uid(),person:name,amount:amt,type:type,note:note,date:new Date().toISOString(),bank:bid,repays:[]});},'Saved. '+(type==='get'?name+' owes you ':'You owe '+name+' ')+fmt(amt));
  }else if(f==='expense'){
    if(!(amt>0))return err('Enter an amount greater than 0.');
    var dv=readDate($('fDate').value);if(!dv)return err('Enter the date as DD-MM-YYYY.');
    if(dv>ts())return err('The date cannot be in the future.');
    var when=dv===ts()?new Date():new Date(+dv.slice(0,4),+dv.slice(5,7)-1,+dv.slice(8,10),12);
    var cat=st.cat,bk=st.bank,nt=$('fNote').value.trim();
    closeSheet();
    act(function(){endSample();var bid=bankById(bk)?bk:'';if(bid)lastBank=bid;
      expenses.unshift({id:'x'+uid(),amount:amt,note:nt,cat:cat,bank:bid,date:when.toISOString()});},'Logged '+fmt(amt)+(bankById(bk)?' from '+bankName(bk):''));
  }else if(f==='bank'){
    var nm=$('fName').value.trim();if(!nm)return err('Enter a bank name.');
    var open=r2(parseFloat($('fOpen').value)||0),col=st.color;
    closeSheet();
    act(function(){endSample();var id='b'+uid();banks.push({id:id,name:nm,opening:open,color:col});if(!lastBank)lastBank=id;},nm+' added');
  }else if(f==='invest'){
    if(!(amt>0))return err('Enter an amount greater than 0.');
    var it=st.itype,ib=st.bank,inm=$('fName').value.trim();
    if(st.mode==='sip'){
      var dd=parseInt($('fSipDay').value,10);
      if(!(dd>=1&&dd<=31))return err('Enter a day between 1 and 31.');
      var tn=new Date(),tEnd=new Date(tn.getFullYear(),tn.getMonth(),tn.getDate(),23,59,59);
      var sdt=sipDue({day:dd},tn.getFullYear(),tn.getMonth());
      if(sdt<=tEnd)sdt=sipDue({day:dd},tn.getFullYear(),tn.getMonth()+1);
      closeSheet();
      act(function(){endSample();var bid=bankById(ib)?ib:'';if(bid)lastBank=bid;
        sips.push({id:'p'+uid(),name:inm,type:it,amount:amt,day:dd,start:sdt.toISOString(),bank:bid,last:''});},
        'SIP set up. '+fmt(amt)+' on the '+ord(dd)+' of every month, first on '+sdt.toLocaleDateString('en-IN',{day:'numeric',month:'short'}));
    }else{
      var iv=readDate($('fDate').value);if(!iv)return err('Enter the date as DD-MM-YYYY.');
      if(iv>ts())return err('The date cannot be in the future.');
      var iw=iv===ts()?new Date():new Date(+iv.slice(0,4),+iv.slice(5,7)-1,+iv.slice(8,10),12);
      closeSheet();
      act(function(){endSample();var bid=bankById(ib)?ib:'';if(bid)lastBank=bid;
        investments.unshift({id:'i'+uid(),name:inm,type:it,amount:amt,sip:false,bank:bid,date:iw.toISOString()});},'Invested '+fmt(amt)+' in '+(inm||it));
    }
  }else if(f==='pay'){
    if(!(amt>0))return err('Enter an amount greater than 0.');
    var who=form.dataset.person,b2=bankById(st.bank)?st.bank:'';
    act(function(){payPerson(who,amt,b2)},'Recorded '+fmt(amt)+(b2?(' in '+bankName(b2)):'')+' with '+who);
  }
}

$('sheet').addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act],[data-chip],[data-fillname],[data-qa]');if(!t)return;
  var d=t.dataset;
  if(d.chip){
    var kv=d.chip.split(':'),g=kv[0];st[g]=kv.slice(1).join(':');if(g==='mode'){var ow=$('onceWrap'),sw=$('sipWrap');if(ow)ow.hidden=st.mode==='sip';if(sw)sw.hidden=st.mode!=='sip';}
    var box=t.closest('[data-group]');Array.prototype.forEach.call(box.querySelectorAll('[data-chip]'),function(c){c.classList.toggle('on',c===t)});
  }else if(d.fillname!==undefined){$('fPerson').value=d.fillname;}
  else if(d.qa){qa(d.qa);}
  else if(d.act==='close'){closeSheet();}
  else if(d.act==='fullpay'){
    var e=entries.find(function(x){return x.id===d.id});if(!e)return;
    act(function(){e.repays.push({id:uid(),amount:outOf(e),date:new Date().toISOString(),bank:e.bank||lastBank||''})},e.type==='get'?'Received ✓':'Paid ✓');
  }else if(d.act==='delentry'){act(function(){entries=entries.filter(function(x){return x.id!==d.id})},'Entry deleted');}
  else if(d.act==='settle'){
    var nm=sheet.id;
    act(function(){entries.forEach(function(x){if(x.person===nm&&outOf(x)>0)x.repays.push({id:uid(),amount:outOf(x),date:new Date().toISOString(),bank:x.bank||lastBank||''})})},'Settled with '+nm);
  }else if(d.act==='bcolor'){var bb=bankById(d.id);if(bb)act(function(){bb.color=d.color},'Colour changed');
  }else if(d.act==='delbank'){
    var id=d.id;closeSheet();
    act(function(){banks=banks.filter(function(b){return b.id!==id});
      investments.forEach(function(x){if(x.bank===id)x.bank=''});sips.forEach(function(x){if(x.bank===id)x.bank=''});expenses.forEach(function(x){if(x.bank===id)x.bank=''});bankLog.forEach(function(l){if(l.bank===id)l.bank=''});
      entries.forEach(function(x){if(x.bank===id)x.bank='';(x.repays||[]).forEach(function(r){if(r.bank===id)r.bank=''})});
      if(lastBank===id)lastBank='';},'Bank removed');
  }
});

    return ws;
  };
  var desc=function(a,b){return b[0]-a[0]};
  var sumRows=[['Money Mate export'],['Exported on',now],[],['Total in banks',t.bank],['To get',t.get],['To give',t.give],['If everyone settles up',t.proj],['Spent this month',sum(monthSpent(0))],['Total invested',sum(investments)]];
  var wsSum=mk(sumRows,[26,18]);if(wsSum.B2)wsSum.B2.z='dd-mmm-yyyy hh:mm';
  var bankRows=[['Bank','Starting balance','Current balance','Pending to get','Pending to give']].concat(banks.map(function(b){var pe=pendingFor(b.id);return [b.name,b.opening,balance(b),pe.get,pe.give]}));

  var entRows=[['Date','Person','Type','Note','Amount','Repaid','Outstanding','Bank']].concat(
    entries.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(e){return [D(e.date),e.person,e.type==='get'?'I’ll get':'I’ll give',e.note||'',e.amount,paidOf(e),outOf(e),bankName(e.bank)]}));
  var rep=[];
  entries.forEach(function(e){(e.repays||[]).forEach(function(r){rep.push([r.date,e.person,e.type==='get'?'Received':'Paid',r.amount,bankName(r.bank)])})});
  bankLog.forEach(function(l){rep.push([l.date,l.person,l.amt>0?'Received':'Paid',Math.abs(l.amt),bankName(l.bank)])});
  rep.sort(function(a,b){return b[0].localeCompare(a[0])});

  var expRows=[['Date','What for','Category','Amount','Paid from']].concat(
    expenses.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(x){return [D(x.date),x.note||'',catOf(x),x.amount,bankName(x.bank)]}));
  var invRows=[['Date','Fund or scheme','Type','Frequency','Amount','Paid from']].concat(
    investments.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(x){return [D(x.date),x.name||'',x.type,x.sip?(x.sipId?'Monthly SIP (auto-debit)':'Monthly SIP'):'One-time',x.amount,bankName(x.bank)]}));
  var wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,wsSum,'Summary');
  X.utils.book_append_sheet(wb,mk(bankRows,[20,18,18,16,16]),'Banks');
  X.utils.book_append_sheet(wb,mk(peopleRows,[24,30,14,13]),'People');
  X.utils.book_append_sheet(wb,mk(entRows,[14,20,12,28,12,12,14,16],[0]),'Entries');
  X.utils.book_append_sheet(wb,mk(repRows,[14,20,12,12,16],[0]),'Repayments');
  X.utils.book_append_sheet(wb,mk(expRows,[14,28,14,12,16],[0]),'Expenses');
  X.utils.book_append_sheet(wb,mk(invRows,[14,28,16,14,12,16],[0]),'Investments');
  var sipRows=[['Fund or scheme','Type','Amount','Auto-debit day','Next debit','Paid from']].concat(sips.map(function(x){return [x.name||'',x.type,x.amount,x.day,nextDue(x),bankName(x.bank)]}));
  X.utils.book_append_sheet(wb,mk(sipRows,[28,16,12,15,14,16],[4]),'SIPs');
  var buf=X.write(wb,{bookType:'xlsx',type:'array'});
  dl.save({filename:'money-mate-'+ts()+'.xlsx',data:new Blob([buf])}).then(function(){toast('Excel file saved')}).catch(function(e){
    if(e&&e.code==='declined')return;toast('Could not save the file');
  });
}

function nativeDl(){
  var C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return null;
  var FS=C.Plugins&&C.Plugins.Filesystem,SH=C.Plugins&&C.Plugins.Share;if(!FS||!SH)return null;
  return {save:function(r){
    return r.data.arrayBuffer().then(function(ab){
      var u8=new Uint8Array(ab),bin='';for(var i=0;i<u8.length;i+=32768)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
      return FS.writeFile({path:r.filename,data:btoa(bin),directory:'CACHE'});
    }).then(function(w){
      return SH.share({title:'Money Mate export',text:'Money Mate Excel export',url:w.uri,dialogTitle:'Save or send your Excel file'});
    }).then(function(){return {status:'saved'}}).catch(function(e){
      throw {code:/cancel/i.test(String(e&&e.message))?'declined':'unavailable',message:String(e&&e.message)};

}

/* motion helpers */
var lastVals={},RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches),enterT=null;
function animateCounts(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-count]'),function(el){
    var key=el.dataset.key,to=parseFloat(el.dataset.count),from=lastVals[key]===undefined?0:lastVals[key];
    lastVals[key]=to;
    if(RM||from===to)return;
    var f=el.dataset.fmt==='s'?fmtS:fmt,t0=null;
    el.textContent=f(from);
    var step=function(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/800),e=1-Math.pow(1-k,3),v=from+(to-from)*e;el.textContent=f(k<1?Math.round(v):to);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function enterView(){
  var v=$('view'),f=$('fab');
  v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');
  clearTimeout(enterT);enterT=setTimeout(function(){v.classList.remove('enter')},1400);
  f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');
}
var indFirst=true;
function moveInd(){
  var a=document.querySelector('.tabin a[aria-current="page"]'),i=document.querySelector('.tab-ind');if(!a||!i)return;
  if(indFirst){i.style.transition='none';}
  i.style.transform='translateX('+(a.offsetLeft+a.offsetWidth/2-25)+'px)';

}

function confetti(){
  if(RM)return;
  var box=document.createElement('div');box.className='confetti';
  var cols=['#3a4cf0','#0b8a8f','#e8912d','#c2255c','#7a3fe0','#2b8a3e'];
  for(var i=0;i<34;i++){var c=document.createElement('i'),ang=(Math.random()*Math.PI)+Math.PI,sp=140+Math.random()*220;
    c.style.setProperty('--c',cols[i%cols.length]);c.style.setProperty('--dx',Math.cos(ang)*sp+'px');c.style.setProperty('--dy',(Math.sin(ang)*sp+Math.random()*260)+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');
    c.style.animationDelay=(Math.random()*.12)+'s';box.appendChild(c);}
  document.body.appendChild(box);setTimeout(function(){box.remove()},1500);
}
function progBar(p){

}
